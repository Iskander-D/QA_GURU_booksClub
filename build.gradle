plugins {
    id 'java-library'
    id 'io.qameta.allure' version '3.0.0'

}

repositories {
    mavenCentral()
}
def allureVersion = "2.21.0",
    restAssuredVersion = "6.0.0",
    shemaValidatorVersion = "6.0.0",
    jacksonVersion = "3.1.0",
    datafakerVersion = "2.5.4",
    assertjVersion = "3.27.7",
    junitVersion = "5.14.3",
    slf4jVersion = "2.0.7",
    selenideVersion = "7.13.0"



compileTestJava
        {
            options.encoding = 'UTF-8'
        }
allure {
    adapter {
        aspectjVersion.set("1.9.21")

    }
    report {
        version.set(allureVersion)

    }
    adapter {
        aspectjWeaver.set(true)
        frameworks {
            junit5 {
                adapterVersion.set(allureVersion)
            }
        }
    }
}

dependencies {
    testImplementation "io.rest-assured:rest-assured:$restAssuredVersion"
    testImplementation "io.rest-assured:json-schema-validator:$shemaValidatorVersion"
    testImplementation "io.qameta.allure:allure-rest-assured:$allureVersion"
    testImplementation "tools.jackson.core:jackson-databind:$jacksonVersion"
    testImplementation "org.slf4j:slf4j-api:$slf4jVersion"
    testImplementation "net.datafaker:datafaker:$datafakerVersion"
    testImplementation "org.assertj:assertj-core:$assertjVersion"
    testImplementation "org.junit.jupiter:junit-jupiter:$junitVersion"
    testImplementation "com.codeborne:selenide:$selenideVersion"

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test) {
    useJUnitPlatform()
    systemProperties(System.getProperties())

    testLogging {
        lifecycle {
            events "started", "skipped", "failed", "standard_error", "standard_out"
            exceptionFormat "short"
        }
    }
}